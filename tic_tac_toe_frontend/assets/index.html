<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic Tac Toe - Regular</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="title">Tic Tac Toe</h1>
      <p class="subtitle">Regular</p>
    </header>

    <main class="main">
      <section class="board-card" aria-label="Tic Tac Toe Game">
        <div class="status-bar">
          <div class="status">
            <span class="label">Turn</span>
            <span id="currentPlayer" class="pill pill-primary" aria-live="polite">X</span>
          </div>
          <div class="scores">
            <div class="score">
              <span class="label">X</span>
              <span id="scoreX" class="score-value">0</span>
            </div>
            <div class="divider" role="presentation"></div>
            <div class="score">
              <span class="label">O</span>
              <span id="scoreO" class="score-value">0</span>
            </div>
          </div>
        </div>

        <div class="board" role="grid" aria-label="3 by 3 grid">
          <button class="cell" data-index="0" role="gridcell" aria-label="Cell 1"></button>
          <button class="cell" data-index="1" role="gridcell" aria-label="Cell 2"></button>
          <button class="cell" data-index="2" role="gridcell" aria-label="Cell 3"></button>
          <button class="cell" data-index="3" role="gridcell" aria-label="Cell 4"></button>
          <button class="cell" data-index="4" role="gridcell" aria-label="Cell 5"></button>
          <button class="cell" data-index="5" role="gridcell" aria-label="Cell 6"></button>
          <button class="cell" data-index="6" role="gridcell" aria-label="Cell 7"></button>
          <button class="cell" data-index="7" role="gridcell" aria-label="Cell 8"></button>
          <button class="cell" data-index="8" role="gridcell" aria-label="Cell 9"></button>
        </div>

        <div class="controls">
          <button id="restartBtn" class="btn btn-accent" type="button">Restart</button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <small class="footer-note">Ocean Professional • Blue & amber accents</small>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
